name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows64
            os: ubuntu-latest
            os_name: mingw
          - target: windows32
            os: ubuntu-latest
            os_name: mingw
          - target: linux
            os: ubuntu-22.04
            os_name: linux
          - target: linuxjack
            os: ubuntu-22.04
            os_name: linux
          - target: macos_x86_64
            os: macos-15
            os_name: macos
          - target: macos_arm64
            os: macos-15
            os_name: macos
          - target: linux_arm64
            os: ubuntu-22.04-arm
            os_name: linux
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_OS: ${{ matrix.os_name }}

    steps:
    - uses: actions/checkout@v7

    - name: setup build linux
      if: ${{ matrix.os_name == 'linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake zip \
                                libasound2-dev \
                                libjack-jackd2-dev \
                                libpulse-dev

    - name: setup build macos
      if: ${{ matrix.os_name == 'macos' }}
      run: brew install cmake || true

    - name: setup build mingw
      if: ${{ matrix.os_name == 'mingw' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 cmake zip

    - name: build
      run: ./dist/build.sh

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.target }}
        path: build/${{ matrix.target }}.zip
        if-no-files-found: error

  # Publish all target zips as GitHub release (only for v* tags and only if
  # every target was built, the app downloads them by target name)
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: release
        merge-multiple: true

    - name: upload release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        ls -l release
        gh release view "$TAG" > /dev/null 2>&1 || \
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
        gh release upload "$TAG" release/*.zip --clobber
